<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>おすすめ投稿確認｜おでかけガイド</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#f6f2e9;--paper:#fffdf8;--ink:#292720;--muted:#7d786e;--line:#d9d3c7;--accent:#4d725d;--soft:#dce8df;--danger:#a54c45}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.wrap{max-width:760px;margin:auto;padding:24px 18px 70px}h1{font-size:27px;margin:5px 0}.eyebrow{font-size:11px;letter-spacing:.16em;color:var(--accent);font-weight:900}.muted,.small{color:var(--muted);font-size:12px;line-height:1.6}.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:18px;margin-top:16px}.item{border-top:1px solid var(--line);padding:16px 0}.item:first-child{border-top:0}.grid{display:grid;gap:10px}input,textarea,select{width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:13px;background:#fff}textarea{min-height:100px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.btn{border:0;border-radius:13px;padding:11px 14px;font:inherit;font-weight:800}.primary{background:var(--accent);color:#fff}.soft{background:var(--soft);color:#365344}.danger{background:#f7e7e4;color:var(--danger)}.hidden{display:none!important}.msg{font-size:12px;font-weight:700;color:var(--accent);min-height:18px}.top{display:flex;justify-content:space-between;gap:10px;align-items:start}.photo{border:1px dashed var(--line);border-radius:14px;padding:12px}.preview{width:100%;max-height:260px;object-fit:cover;border-radius:12px;margin-bottom:8px}.check{display:flex;gap:8px;align-items:center}.check input{width:auto}@media(min-width:640px){.two{grid-template-columns:1fr 1fr}}</style></head><body><main class="wrap"><div class="top"><div><div class="eyebrow">RECOMMENDATIONS</div><h1>おすすめ投稿確認</h1><div class="muted">投稿内容を整えて、そのまま一般ページへ掲載できます。</div></div><a href="admin.html" class="small">通常の管理画面へ</a></div><section id="login" class="card"><h2>管理者ログイン</h2><form id="loginForm" class="grid"><input name="email" type="email" placeholder="メールアドレス" required><input name="password" type="password" placeholder="パスワード" required><button class="btn primary">ログイン</button><div id="loginMsg" class="msg"></div></form></section><div id="main" class="hidden"><section id="editor" class="card hidden"><div class="top"><h2>掲載内容を編集</h2><button id="closeEditor" class="btn soft">閉じる</button></div><form id="publishForm" class="grid"><input type="hidden" name="recommendation_id"><div class="grid two"><input name="name" placeholder="スポット名 *" required><select name="area" required><option value="">市町 *</option><option>姫路市</option><option>宍粟市</option><option>たつの市</option><option>太子町</option><option>上郡町</option><option>相生市</option><option>赤穂市</option></select></div><input name="genre" placeholder="ジャンル *" required><input name="lead" placeholder="短い紹介文"><textarea name="description" placeholder="詳しい紹介文"></textarea><input name="tags" placeholder="タグ（カンマ区切り）"><div class="photo"><b>写真</b><img id="preview" class="preview hidden"><input id="imageFile" type="file" accept="image/*"><div id="uploadMsg" class="msg"></div></div><input name="website_url" placeholder="公式サイトURL"><input name="instagram_url" placeholder="Instagram URL"><input name="post_url" placeholder="紹介投稿URL"><input name="maps_url" placeholder="Google Maps URL"><div class="grid two"><input name="sort_order" type="number" value="100" placeholder="表示順"><label class="check"><input name="featured" type="checkbox">PICK UPに表示</label></div><label class="check"><input name="published" type="checkbox" checked>保存と同時に一般公開</label><button class="btn primary">この内容でスポット登録</button><div id="publishMsg" class="msg"></div></form></section><section class="card"><div class="top"><h2>確認待ち</h2><button id="reload" class="btn soft">更新</button></div><div id="list"><div class="small">読み込み中…</div></div></section></div></main><script>const U='https://jtsllyiuwdjpoulcwvqx.supabase.co',K='sb_publishable_HpRt1_FQGdfIMZo9z7Dc9Q_7DmdJnCc',db=supabase.createClient(U,K),$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let recs=[];function slugify(s){return String(s||'spot').normalize('NFKC').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||('spot-'+Date.now())}async function session(){const{data:{session}}=await db.auth.getSession();if(!session)return;$('#login').classList.add('hidden');$('#main').classList.remove('hidden');load()}$('#loginForm').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget,{error}=await db.auth.signInWithPassword({email:f.email.value.trim(),password:f.password.value});if(error)return $('#loginMsg').textContent='ログインできません：'+error.message;session()};async function load(){const{data,error}=await db.from('recommendations').select('*').eq('status','pending').order('created_at',{ascending:false});if(error)return $('#list').innerHTML='<div class="msg">'+esc(error.message)+'</div>';recs=data||[];$('#list').innerHTML=recs.length?recs.map(x=>`<div class="item"><b>${esc(x.spot_name||'名称未入力')}</b><div class="small">${esc(x.municipality||'')} ・ ${esc(x.category||'')}</div><p>${esc(x.recommendation||'')}</p>${x.url?`<a href="${esc(x.url)}" target="_blank" class="small">参考URLを開く</a>`:''}<div class="row" style="margin-top:10px"><button class="btn primary" onclick="editRec('${x.id}')">掲載用に編集</button><button class="btn danger" onclick="rejectRec('${x.id}')">見送る</button></div></div>`).join(''):'<div class="small">確認待ちの投稿はありません。</div>'}window.editRec=id=>{const x=recs.find(r=>r.id===id);if(!x)return;const f=$('#publishForm');f.reset();f.recommendation_id.value=x.id;f.name.value=x.spot_name||'';f.area.value=x.municipality||'';f.genre.value=x.category||'';f.description.value=x.recommendation||'';f.sort_order.value=100;f.published.checked=true;const u=x.url||'';if(/instagram\.com/i.test(u))f.instagram_url.value=u;else if(/google\.[^/]+\/maps|maps\.app\.goo\.gl/i.test(u))f.maps_url.value=u;else f.website_url.value=u;$('#editor').classList.remove('hidden');$('#publishMsg').textContent='';$('#preview').classList.add('hidden');$('#imageFile').value='';scrollTo({top:0,behavior:'smooth'})};$('#imageFile').onchange=e=>{const f=e.target.files?.[0];if(f){$('#preview').src=URL.createObjectURL(f);$('#preview').classList.remove('hidden')}};async function upload(file){if(!file)return null;if(file.size>10*1024*1024)throw Error('画像は10MB以下にしてください');$('#uploadMsg').textContent='写真をアップロード中…';const ext=(file.name.split('.').pop()||'jpg').toLowerCase(),path=`${Date.now()}-${crypto.randomUUID()}.${ext}`,{error}=await db.storage.from('spot-images').upload(path,file,{contentType:file.type||'image/jpeg'});if(error)throw error;const{data}=db.storage.from('spot-images').getPublicUrl(path);return data.publicUrl}$('#publishForm').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget;try{$('#publishMsg').textContent='登録中…';const image=await upload($('#imageFile').files?.[0]);const p={name:f.name.value.trim(),area:f.area.value,genre:f.genre.value.trim(),slug:slugify(f.name.value)+'-'+Date.now().toString(36),lead:f.lead.value.trim(),description:f.description.value.trim(),tags:f.tags.value.split(',').map(v=>v.trim()).filter(Boolean),image_url:image,website_url:f.website_url.value.trim()||null,instagram_url:f.instagram_url.value.trim()||null,post_url:f.post_url.value.trim()||null,maps_url:f.maps_url.value.trim()||null,sort_order:Number(f.sort_order.value||100),featured:f.featured.checked,published:f.published.checked,updated_at:new Date().toISOString()};const{error}=await db.from('spots').insert(p);if(error)throw error;const r=await db.from('recommendations').update({status:'approved'}).eq('id',f.recommendation_id.value);if(r.error)throw r.error;alert('スポットとして登録しました。公開ONなら一般ページにも反映されます。');$('#editor').classList.add('hidden');await load()}catch(err){$('#publishMsg').textContent='登録できません：'+err.message}};window.rejectRec=async id=>{if(!confirm('この投稿を見送りますか？'))return;const{error}=await db.from('recommendations').update({status:'rejected'}).eq('id',id);if(error)return alert(error.message);load()};$('#closeEditor').onclick=()=>$('#editor').classList.add('hidden');$('#reload').onclick=load;db.auth.onAuthStateChange(()=>setTimeout(session,0));session();</script></body></html>
