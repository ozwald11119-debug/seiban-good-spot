<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f2e9"><title>管理画面｜西播磨＋姫路 おでかけガイド</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#f6f2e9;--paper:#fffdf8;--ink:#292720;--muted:#7d786e;--line:#d9d3c7;--accent:#4d725d;--soft:#dce8df;--danger:#a54c45}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.wrap{max-width:760px;margin:auto;padding:24px 18px 60px}.eyebrow{font-size:11px;letter-spacing:.16em;color:var(--accent);font-weight:900}h1{font-size:28px;margin:5px 0 6px}h2{font-size:20px;margin:0 0 14px}.muted,.small{color:var(--muted);font-size:12px;line-height:1.6}.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:18px;margin-top:16px;box-shadow:0 10px 30px rgba(42,39,32,.05)}.grid{display:grid;gap:10px}input,textarea,select{width:100%;font:inherit;padding:12px 13px;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--ink)}textarea{min-height:100px;resize:vertical}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.btn{font:inherit;border:0;border-radius:13px;padding:11px 14px;font-weight:800;cursor:pointer}.primary{background:var(--accent);color:#fff}.soft{background:var(--soft);color:#365344}.danger{background:#f7e7e4;color:var(--danger)}.item{border-top:1px solid var(--line);padding:14px 0}.item:first-child{border-top:0}.item b{display:block;margin-bottom:4px}.hidden{display:none!important}.msg{font-size:12px;font-weight:700;color:var(--accent);min-height:18px}.check{display:flex;gap:8px;align-items:center}.check input{width:auto}.topbar{display:flex;justify-content:space-between;gap:12px;align-items:start}.pill,.status{display:inline-block;border-radius:999px;background:var(--soft);padding:5px 9px;font-size:11px;font-weight:800}.status.off{background:#eee;color:#777}.tabs{display:flex;gap:7px;overflow:auto}.tabs button{white-space:nowrap}.tabs .on{background:var(--accent);color:#fff}.photoBox{border:1px dashed var(--line);border-radius:16px;padding:12px}.photoPreview{width:100%;max-height:260px;object-fit:cover;border-radius:12px;margin-bottom:10px}.itemHead{display:flex;gap:12px;align-items:center}.thumb{width:64px;height:64px;border-radius:12px;object-fit:cover;background:#eee}.grow{flex:1}.order{width:76px!important;padding:8px!important}.stickySave{position:sticky;bottom:10px;z-index:5;background:rgba(255,253,248,.94);padding:9px;border-radius:16px;border:1px solid var(--line);backdrop-filter:blur(8px)}@media(min-width:640px){.two{grid-template-columns:1fr 1fr}}</style></head><body><main class="wrap"><div class="topbar"><div><div class="eyebrow">ADMIN</div><h1>おでかけガイド管理</h1><div class="muted">スマホから追加・編集・公開できます</div></div><a href="./" class="small">一般ページへ</a></div><section id="loginCard" class="card"><h2>管理者ログイン</h2><form id="loginForm" class="grid"><input name="email" type="email" autocomplete="username" placeholder="メールアドレス" required><input name="password" type="password" autocomplete="current-password" placeholder="パスワード" required><button class="btn primary">ログイン</button><div id="loginMsg" class="msg"></div></form></section><div id="admin" class="hidden"><section class="card"><div class="topbar"><div><h2>スポット登録・編集</h2><div id="who" class="small"></div></div><button id="logout" class="btn soft">ログアウト</button></div><form id="spotForm" class="grid"><input type="hidden" name="id"><div class="grid two"><input name="name" placeholder="スポット名 *" required><select name="area" required><option value="">市町を選択 *</option><option>姫路市</option><option>宍粟市</option><option>たつの市</option><option>太子町</option><option>上郡町</option><option>相生市</option><option>赤穂市</option></select></div><div class="grid two"><input name="genre" placeholder="ジャンル（例：カフェ）"><input name="slug" placeholder="slug（空欄でOK）"></div><input name="lead" placeholder="短い紹介文"><textarea name="description" placeholder="詳しい紹介文"></textarea><input name="tags" placeholder="タグ（カンマ区切り）"><div class="photoBox"><b>写真</b><div class="small">iPhoneの写真ライブラリから選べます（10MBまで）</div><img id="photoPreview" class="photoPreview hidden" alt="プレビュー"><input id="imageFile" type="file" accept="image/*"><div id="uploadMsg" class="msg"></div><input name="image_url" placeholder="または画像URLを入力"></div><input name="website_url" placeholder="公式サイトURL"><input name="instagram_url" placeholder="Instagram URL"><input name="post_url" placeholder="紹介投稿URL"><input name="maps_url" placeholder="Google Maps URL"><div class="grid two"><label>表示順<input name="sort_order" type="number" value="100"></label><label class="check"><input name="featured" type="checkbox"> PICK UPに表示</label></div><label class="check"><input name="published" type="checkbox" checked> 公開する</label><div class="row stickySave"><button class="btn primary" id="saveBtn">保存</button><button class="btn soft hidden" id="cancelEdit" type="button">編集をやめる</button><span id="spotMsg" class="msg"></span></div></form></section><section class="card"><div class="topbar"><h2>登録済みスポット</h2><span id="spotCount" class="pill">0件</span></div><div id="spotList"><div class="small">読み込み中…</div></div></section><section class="card"><h2>おすすめ投稿</h2><div class="tabs" id="tabs"><button class="btn soft on" data-status="pending">確認待ち</button><button class="btn soft" data-status="approved">掲載済み</button><button class="btn soft" data-status="rejected">見送り</button><button class="btn soft" data-status="all">すべて</button></div><div id="recList"></div></section></div></main><script>const U='https://jtsllyiuwdjpoulcwvqx.supabase.co',K='sb_publishable_HpRt1_FQGdfIMZo9z7Dc9Q_7DmdJnCc',db=supabase.createClient(U,K);let spots=[],recs=[],filter='pending';const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function slugify(s){return String(s||'spot').normalize('NFKC').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||('spot-'+Date.now())}function preview(url){const p=$('#photoPreview');if(url){p.src=url;p.classList.remove('hidden')}else{p.removeAttribute('src');p.classList.add('hidden')}}function resetForm(){const f=$('#spotForm');f.reset();f.elements.id.value='';f.elements.sort_order.value=100;f.elements.published.checked=true;$('#imageFile').value='';preview('');$('#saveBtn').textContent='保存';$('#cancelEdit').classList.add('hidden');$('#spotMsg').textContent='';$('#uploadMsg').textContent=''}async function showSession(){const{data:{session}}=await db.auth.getSession();if(!session){$('#loginCard').classList.remove('hidden');$('#admin').classList.add('hidden');return}$('#loginCard').classList.add('hidden');$('#admin').classList.remove('hidden');$('#who').textContent=session.user.email||'';await loadAll()}$('#loginForm').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget;$('#loginMsg').textContent='ログイン中…';const{error}=await db.auth.signInWithPassword({email:f.elements.email.value.trim(),password:f.elements.password.value});if(error)return $('#loginMsg').textContent='ログインできません：'+error.message;$('#loginMsg').textContent='';showSession()};$('#logout').onclick=async()=>{await db.auth.signOut();location.reload()};$('#cancelEdit').onclick=resetForm;$('#imageFile').onchange=e=>{const file=e.target.files?.[0];if(file)preview(URL.createObjectURL(file))};async function uploadImage(file){if(!file)return null;if(file.size>10*1024*1024)throw new Error('画像は10MB以下にしてください');$('#uploadMsg').textContent='写真をアップロード中…';const ext=(file.name.split('.').pop()||'jpg').toLowerCase(),path=`${Date.now()}-${crypto.randomUUID()}.${ext}`;const{error}=await db.storage.from('spot-images').upload(path,file,{contentType:file.type||'image/jpeg'});if(error)throw error;const{data}=db.storage.from('spot-images').getPublicUrl(path);$('#uploadMsg').textContent='写真をアップロードしました';return data.publicUrl}async function loadAll(){const[s,r]=await Promise.all([db.from('spots').select('*').order('sort_order').order('created_at',{ascending:false}),db.from('recommendations').select('*').order('created_at',{ascending:false})]);if(s.error)$('#spotList').innerHTML='<div class="msg">取得できません：'+esc(s.error.message)+'</div>';else{spots=s.data||[];renderSpots()}if(r.error)$('#recList').innerHTML='<div class="msg">取得できません：'+esc(r.error.message)+'</div>';else{recs=r.data||[];renderRecs()}}function renderSpots(){$('#spotCount').textContent=spots.length+'件';$('#spotList').innerHTML=spots.length?spots.map(x=>`<div class="item"><div class="itemHead">${x.image_url?`<img class="thumb" src="${esc(x.image_url)}">`:`<div class="thumb"></div>`}<div class="grow"><b>${esc(x.name)}</b><div class="small">${esc(x.area)} ・ ${esc(x.genre||'未分類')}　<span class="status ${x.published?'':'off'}">${x.published?'公開中':'非公開'}</span>${x.featured?' <span class="status">PICK UP</span>':''}</div></div></div><div class="row" style="margin-top:10px"><button class="btn soft" onclick="editSpot('${x.id}')">編集</button><button class="btn soft" onclick="publishSpot('${x.id}',${!x.published})">${x.published?'非公開':'公開'}</button><label class="small">順番 <input class="order" type="number" value="${Number(x.sort_order||100)}" onchange="changeOrder('${x.id}',this.value)"></label><button class="btn danger" onclick="deleteSpot('${x.id}')">削除</button></div></div>`).join(''):'<div class="small">まだ登録がありません。</div>'}window.editSpot=id=>{const x=spots.find(v=>String(v.id)===String(id));if(!x)return;const f=$('#spotForm');['id','name','area','genre','slug','lead','description','image_url','website_url','instagram_url','post_url','maps_url','sort_order'].forEach(k=>f.elements[k]&&(f.elements[k].value=x[k]??''));f.elements.tags.value=(x.tags||[]).join(', ');f.elements.featured.checked=!!x.featured;f.elements.published.checked=!!x.published;preview(x.image_url||'');$('#saveBtn').textContent='変更を保存';$('#cancelEdit').classList.remove('hidden');$('#spotMsg').textContent='「'+x.name+'」を編集中';scrollTo({top:0,behavior:'smooth'})};$('#spotForm').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget,id=f.elements.id.value;try{$('#spotMsg').textContent='保存中…';let image=f.elements.image_url.value.trim()||null,file=$('#imageFile').files?.[0];if(file)image=await uploadImage(file);const p={name:f.elements.name.value.trim(),area:f.elements.area.value,genre:f.elements.genre.value.trim(),slug:f.elements.slug.value.trim()||slugify(f.elements.name.value),lead:f.elements.lead.value.trim(),description:f.elements.description.value.trim(),tags:f.elements.tags.value.split(',').map(v=>v.trim()).filter(Boolean),image_url:image,website_url:f.elements.website_url.value.trim()||null,instagram_url:f.elements.instagram_url.value.trim()||null,post_url:f.elements.post_url.value.trim()||null,maps_url:f.elements.maps_url.value.trim()||null,sort_order:Number(f.elements.sort_order.value||100),featured:f.elements.featured.checked,published:f.elements.published.checked,updated_at:new Date().toISOString()};const res=id?await db.from('spots').update(p).eq('id',id):await db.from('spots').insert(p);if(res.error)throw res.error;resetForm();await loadAll();alert(id?'変更しました':'登録しました')}catch(err){$('#spotMsg').textContent='保存できません：'+err.message}};window.publishSpot=async(id,next)=>{const{error}=await db.from('spots').update({published:next,updated_at:new Date().toISOString()}).eq('id',id);if(error)return alert(error.message);await loadAll()};window.changeOrder=async(id,value)=>{const{error}=await db.from('spots').update({sort_order:Number(value),updated_at:new Date().toISOString()}).eq('id',id);if(error)return alert(error.message);await loadAll()};window.deleteSpot=async id=>{const x=spots.find(v=>String(v.id)===String(id));if(!confirm('「'+(x?.name||'このスポット')+'」を削除しますか？'))return;const{error}=await db.from('spots').delete().eq('id',id);if(error)return alert(error.message);await loadAll()};$('#tabs').onclick=e=>{const b=e.target.closest('[data-status]');if(!b)return;filter=b.dataset.status;document.querySelectorAll('[data-status]').forEach(x=>x.classList.toggle('on',x===b));renderRecs()};function renderRecs(){const rows=filter==='all'?recs:recs.filter(x=>(x.status||'pending')===filter);$('#recList').innerHTML=rows.length?rows.map(x=>`<div class="item"><b>${esc(x.spot_name||'名称未入力')}</b><div class="small">${esc(x.municipality||'')} ・ ${esc(x.category||'')}</div><div style="font-size:13px;line-height:1.7;margin-top:6px">${esc(x.recommendation||'')}</div>${x.url?`<a class="small" href="${esc(x.url)}" target="_blank" rel="noopener">参考URLを開く</a>`:''}<div class="row" style="margin-top:9px">${(x.status||'pending')==='pending'?`<button class="btn primary" onclick="reviewRec('${x.id}')">掲載用に編集</button>`:''}<button class="btn danger" onclick="setRec('${x.id}','rejected')">見送り</button>${(x.status||'pending')!=='pending'?`<button class="btn soft" onclick="setRec('${x.id}','pending')">確認待ちに戻す</button>`:''}</div></div>`).join(''):'<div class="small">該当する投稿はありません。</div>'}window.reviewRec=id=>{location.href='recommend-review.html?id='+encodeURIComponent(id)};window.setRec=async(id,status)=>{const{error}=await db.from('recommendations').update({status}).eq('id',id);if(error)return alert(error.message);await loadAll()};db.auth.onAuthStateChange(()=>setTimeout(showSession,0));showSession();</script></body></html>
