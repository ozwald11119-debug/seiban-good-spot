<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f2e9"><title>管理画面｜西播磨＋姫路 おでかけガイド</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f6f2e9;--paper:#fffdf8;--ink:#292720;--muted:#7d786e;--line:#d9d3c7;--accent:#4d725d;--soft:#dce8df;--danger:#a54c45}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.wrap{max-width:760px;margin:auto;padding:24px 18px 60px}.eyebrow{font-size:11px;letter-spacing:.16em;color:var(--accent);font-weight:900}h1{font-size:28px;margin:5px 0 6px}h2{font-size:20px;margin:0 0 14px}.muted,.small{color:var(--muted);font-size:12px;line-height:1.6}.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:18px;margin-top:16px;box-shadow:0 10px 30px rgba(42,39,32,.05)}.grid{display:grid;gap:10px}input,textarea,select{width:100%;font:inherit;padding:12px 13px;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--ink)}textarea{min-height:110px;resize:vertical}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.btn{font:inherit;border:0;border-radius:13px;padding:11px 14px;font-weight:800;cursor:pointer}.primary{background:var(--accent);color:white}.soft{background:var(--soft);color:#365344}.danger{background:#f7e7e4;color:var(--danger)}.item{border-top:1px solid var(--line);padding:14px 0}.item:first-child{border-top:0}.item b{display:block;margin-bottom:4px}.hidden{display:none!important}.msg{font-size:12px;font-weight:700;color:var(--accent);min-height:18px}.check{display:flex;gap:8px;align-items:center}.check input{width:auto}.topbar{display:flex;justify-content:space-between;gap:12px;align-items:start}.pill{display:inline-block;border-radius:999px;background:var(--soft);padding:5px 9px;font-size:11px;font-weight:800}.tabs{display:flex;gap:7px;overflow:auto}.tabs button{white-space:nowrap}.tabs .on{background:var(--accent);color:#fff}@media(min-width:640px){.two{grid-template-columns:1fr 1fr}}
</style>
</head><body><main class="wrap">
<div class="topbar"><div><div class="eyebrow">ADMIN</div><h1>おでかけガイド管理</h1><div class="muted">スポットの追加・編集・公開管理</div></div><a href="./" class="small">一般ページへ</a></div>
<section id="loginCard" class="card"><h2>管理者ログイン</h2><form id="loginForm" class="grid"><input name="email" type="email" autocomplete="username" placeholder="メールアドレス" required><input name="password" type="password" autocomplete="current-password" placeholder="パスワード" required><button class="btn primary">ログイン</button><div id="loginMsg" class="msg"></div></form></section>
<div id="admin" class="hidden">
<section class="card"><div class="topbar"><div><h2>スポット登録・編集</h2><div id="who" class="small"></div></div><button id="logout" class="btn soft">ログアウト</button></div>
<form id="spotForm" class="grid"><input type="hidden" name="id"><div class="grid two"><input name="name" placeholder="スポット名 *" required><select name="area" required><option value="">市町を選択 *</option><option>姫路市</option><option>宍粟市</option><option>たつの市</option><option>太子町</option><option>上郡町</option><option>相生市</option><option>赤穂市</option></select></div><div class="grid two"><input name="genre" placeholder="ジャンル（例：カフェ）"><input name="slug" placeholder="slug（空欄なら自動）"></div><input name="lead" placeholder="短い紹介文"><textarea name="description" placeholder="詳しい紹介文"></textarea><textarea name="tags" placeholder="タグ（カンマ区切り）"></textarea><input name="image_url" placeholder="画像URL"><input name="website_url" placeholder="公式サイトURL"><input name="instagram_url" placeholder="Instagram URL"><input name="post_url" placeholder="紹介投稿URL"><input name="maps_url" placeholder="Google Maps URL"><div class="grid two"><input name="sort_order" type="number" value="100" placeholder="表示順"><label class="check"><input name="featured" type="checkbox"> PICK UPに表示</label></div><label class="check"><input name="published" type="checkbox" checked> 公開する</label><div class="row"><button class="btn primary" id="saveBtn">保存</button><button class="btn soft hidden" id="cancelEdit" type="button">編集をやめる</button></div><div id="spotMsg" class="msg"></div></form></section>
<section class="card"><div class="topbar"><h2>登録済みスポット</h2><span id="spotCount" class="pill">0件</span></div><div id="spotList"><div class="small">読み込み中…</div></div></section>
<section class="card"><h2>おすすめ投稿</h2><div class="tabs" id="tabs"><button class="btn soft on" data-status="pending">確認待ち</button><button class="btn soft" data-status="approved">採用済み</button><button class="btn soft" data-status="rejected">見送り</button><button class="btn soft" data-status="all">すべて</button></div><div id="recList"><div class="small">読み込み中…</div></div></section>
</div></main>
<script>
const SUPABASE_URL='https://jtsllyiuwdjpoulcwvqx.supabase.co';const SUPABASE_ANON_KEY='sb_publishable_ZcYjFbZ5f7WhH0D7j1CX0Q_C3EwN6VU';const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);let spots=[],recs=[],filter='pending';const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function slugify(s){return String(s||'spot').normalize('NFKC').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||('spot-'+Date.now())}function resetForm(){const f=$('#spotForm');f.reset();f.elements.id.value='';f.elements.sort_order.value=100;f.elements.published.checked=true;$('#saveBtn').textContent='保存';$('#cancelEdit').classList.add('hidden');$('#spotMsg').textContent=''}
async function showSession(){const {data:{session}}=await db.auth.getSession();if(!session){$('#loginCard').classList.remove('hidden');$('#admin').classList.add('hidden');return}$('#loginCard').classList.add('hidden');$('#admin').classList.remove('hidden');$('#who').textContent=session.user.email||'';await loadAll()}
$('#loginForm').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget;$('#loginMsg').textContent='ログイン中…';const {error}=await db.auth.signInWithPassword({email:f.elements.email.value.trim(),password:f.elements.password.value});if(error){$('#loginMsg').textContent='ログインできません：'+error.message;return}$('#loginMsg').textContent='';showSession()};$('#logout').onclick=async()=>{await db.auth.signOut();location.reload()};$('#cancelEdit').onclick=resetForm;
async function loadAll(){const [s,r]=await Promise.all([db.from('spots').select('*').order('sort_order',{ascending:true}).order('created_at',{ascending:false}),db.from('recommendations').select('*').order('created_at',{ascending:false})]);if(s.error){$('#spotList').innerHTML='<div class="msg">スポットを取得できません：'+esc(s.error.message)+'</div>'}else{spots=s.data||[];renderSpots()}if(r.error){$('#recList').innerHTML='<div class="msg">おすすめ投稿を取得できません：'+esc(r.error.message)+'</div>'}else{recs=r.data||[];renderRecs()}}
function renderSpots(){$('#spotCount').textContent=spots.length+'件';$('#spotList').innerHTML=spots.length?spots.map(x=>`<div class="item"><b>${esc(x.name)}</b><div class="small">${esc(x.area)} ・ ${esc(x.genre||'未分類')} ・ ${x.published?'公開中':'非公開'}</div><div class="row" style="margin-top:9px"><button class="btn soft" onclick="editSpot('${x.id}')">編集</button><button class="btn soft" onclick="publishSpot('${x.id}',${!x.published})">${x.published?'非公開にする':'公開する'}</button><button class="btn danger" onclick="deleteSpot('${x.id}')">削除</button></div></div>`).join(''):'<div class="small">まだ登録がありません。</div>'}
window.editSpot=id=>{const x=spots.find(v=>String(v.id)===String(id));if(!x)return;const f=$('#spotForm');['id','name','area','genre','slug','lead','description','image_url','website_url','instagram_url','post_url','maps_url','sort_order'].forEach(k=>{if(f.elements[k])f.elements[k].value=x[k]??''});f.elements.tags.value=(x.tags||[]).join(', ');f.elements.featured.checked=!!x.featured;f.elements.published.checked=!!x.published;$('#saveBtn').textContent='変更を保存';$('#cancelEdit').classList.remove('hidden');$('#spotMsg').textContent='「'+x.name+'」を編集中';scrollTo({top:0,behavior:'smooth'})};
$('#spotForm').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget,id=f.elements.id.value;const p={name:f.elements.name.value.trim(),area:f.elements.area.value,genre:f.elements.genre.value.trim(),slug:f.elements.slug.value.trim()||slugify(f.elements.name.value),lead:f.elements.lead.value.trim(),description:f.elements.description.value.trim(),tags:f.elements.tags.value.split(',').map(v=>v.trim()).filter(Boolean),image_url:f.elements.image_url.value.trim()||null,website_url:f.elements.website_url.value.trim()||null,instagram_url:f.elements.instagram_url.value.trim()||null,post_url:f.elements.post_url.value.trim()||null,maps_url:f.elements.maps_url.value.trim()||null,sort_order:Number(f.elements.sort_order.value||100),featured:f.elements.featured.checked,published:f.elements.published.checked,updated_at:new Date().toISOString()};$('#spotMsg').textContent='保存中…';const res=id?await db.from('spots').update(p).eq('id',id):await db.from('spots').insert(p);if(res.error){$('#spotMsg').textContent='保存できません：'+res.error.message;return}resetForm();await loadAll()};
window.publishSpot=async(id,next)=>{const {error}=await db.from('spots').update({published:next,updated_at:new Date().toISOString()}).eq('id',id);if(error)return alert('変更できません：'+error.message);await loadAll()};window.deleteSpot=async id=>{const x=spots.find(v=>String(v.id)===String(id));if(!confirm('「'+(x?.name||'このスポット')+'」を削除しますか？'))return;const {error}=await db.from('spots').delete().eq('id',id);if(error)return alert('削除できません：'+error.message);await loadAll()};
$('#tabs').onclick=e=>{const b=e.target.closest('[data-status]');if(!b)return;filter=b.dataset.status;document.querySelectorAll('[data-status]').forEach(x=>x.classList.toggle('on',x===b));renderRecs()};function renderRecs(){const rows=filter==='all'?recs:recs.filter(x=>(x.status||'pending')===filter);$('#recList').innerHTML=rows.length?rows.map(x=>`<div class="item"><b>${esc(x.spot_name||x.name||'名称未入力')}</b><div class="small">${esc(x.municipality||x.area||'')} ・ ${esc(x.category||'')}</div><div style="font-size:13px;line-height:1.7;margin-top:6px">${esc(x.recommendation||x.message||'')}</div>${x.url?`<div><a class="small" href="${esc(x.url)}" target="_blank" rel="noopener">参考URLを開く</a></div>`:''}<div class="row" style="margin-top:9px"><button class="btn primary" onclick="setRec('${x.id}','approved')">採用済みにする</button><button class="btn danger" onclick="setRec('${x.id}','rejected')">見送り</button><button class="btn soft" onclick="setRec('${x.id}','pending')">確認待ち</button></div></div>`).join(''):'<div class="small">該当する投稿はありません。</div>'}window.setRec=async(id,status)=>{const {error}=await db.from('recommendations').update({status}).eq('id',id);if(error)return alert('更新できません：'+error.message);await loadAll()};db.auth.onAuthStateChange(()=>setTimeout(showSession,0));showSession();
</script></body></html>
